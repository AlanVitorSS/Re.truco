<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE.Truco Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --madeira:#26170f; --madeira2:#3b2418; --borda:#5a3a26;
  --t1:#267447; --t2:#205f3a;
  --creme:#f5ecd9; --creme2:#e4d5b4; --tinta:#1f1712;
  --ouro:#e8b54a; --azul:#8ec5e8; --verde:#2f7d5a; --tomate:#c9442f; --naipe:#b5281f;
  --fd:'Alfa Slab One',Georgia,serif;
  --fb:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--madeira);color:var(--creme);font-family:var(--fb);font-size:16px;line-height:1.35;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto}

/* botões e campos */
.btn{padding:14px 18px;border-radius:12px;background:var(--ouro);color:var(--tinta);font-weight:700;font-size:17px;box-shadow:0 3px 0 #9b7424}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9b7424}
.btn.sec{background:var(--creme2);box-shadow:0 3px 0 #9d8e69}
.btn.ok{background:var(--verde);color:#fff;box-shadow:0 3px 0 #1d5037}
.btn.no{background:var(--tomate);color:#fff;box-shadow:0 3px 0 #86281b}
.btn[disabled]{opacity:.4;pointer-events:none}
input{width:100%;padding:13px 14px;border-radius:10px;border:2px solid var(--borda);background:#1b110b;color:var(--creme);font:inherit;font-size:17px}
.panel{background:var(--madeira2);border:2px solid var(--borda);border-radius:16px;padding:16px;display:grid;gap:12px}

/* início */
.home{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px}
.logo{font-family:var(--fd);font-size:clamp(42px,14vw,64px);line-height:.95}
.sub{color:var(--creme2);max-width:30ch}
.hint{font-size:14px;color:var(--creme2)}
details{background:var(--madeira2);border:2px solid var(--borda);border-radius:12px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
details p{margin-top:8px;font-size:14px;color:var(--creme2)}
.manrow{display:flex;gap:8px;margin-top:10px}
.manrow .card{--cw:clamp(52px,16vw,70px)}

/* sala */
.lobby{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.code{font-family:var(--fd);font-size:46px;letter-spacing:.12em;text-align:center;color:var(--ouro)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--borda);font-weight:700}
.seg button.on{background:var(--creme);color:var(--tinta);border-color:var(--creme)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--madeira2);border-left:8px solid var(--ouro)}
.slot.t1{border-left-color:var(--azul)}
.slot small{color:var(--creme2)}
.tag{font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1)}
.row{display:flex;gap:8px}.row>*{flex:1}

/* jogo */
.game{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.score{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--creme2)}
.score b{font-family:var(--fd);font-weight:400;font-size:28px}
.score .us{color:var(--ouro)}.score .them{color:var(--azul)}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--creme2)}
.pip.w{background:var(--ouro);border-color:var(--ouro)}
.pip.l{background:var(--azul);border-color:var(--azul)}
.val{padding:6px 12px;border-radius:999px;background:var(--creme);color:var(--tinta);font-weight:700;font-size:14px}
.exit{font-size:13px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08)}

.table{flex:1;min-height:0;position:relative;isolation:isolate;overflow:hidden;
  border-radius:48% / 24%;border:7px solid #6a4b2a;padding:8px;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(86,151,91,.28),transparent 62%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),
    radial-gradient(ellipse at center,#28794a 0%,#1e633b 72%,#174d30 100%);
  box-shadow:inset 0 0 0 3px rgba(221,190,121,.35),inset 0 0 35px rgba(0,0,0,.32),0 4px 0 #3d2918}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:clamp(52px,15vw,76px);z-index:2}
.seat .who{font-size:clamp(10px,2.8vw,12px);font-weight:700;background:rgba(20,8,4,.72);padding:3px 8px;border-radius:999px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .who small{font-weight:400;color:var(--creme2);margin-left:5px}
.seat.turn .who{background:var(--ouro);color:var(--tinta)}
.backs{display:flex}
.backs .card{--cw:24px;margin-left:-11px}
.backs .card:first-child{margin-left:0}
.n6 .seat .who small,.n8 .seat .who small,.n10 .seat .who small{display:none}
.n8 .backs .card,.n10 .backs .card{--cw:16px;margin-left:-7px}
.n8 .backs .card:first-child,.n10 .backs .card:first-child{margin-left:0}
.play{position:absolute;transform:translate(-50%,-50%);--cw:clamp(32px,11vw,56px);z-index:1}
.n6 .play{--cw:clamp(32px,10.5vw,46px)}
.n8 .play,.n10 .play{--cw:clamp(26px,8vw,36px)}
.play .card.new{animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-22px) scale(1.25);opacity:.2}}

.msg{min-height:2.7em;text-align:center;color:var(--creme2);font-size:15px;padding:0 6px}
.me{display:flex;flex-direction:column;align-items:center;gap:4px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.vbtns{display:flex;gap:6px}
.vbtns .btn{padding:8px 12px;font-size:14px;box-shadow:none}
.whorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.micbtn{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700}
.micbtn.on{background:var(--verde);color:#fff}
.micbtn.mute{background:var(--tomate);color:#fff}
.btn.micbtn{padding:13px 18px;font-size:17px;border-radius:12px;background:var(--creme2);color:var(--tinta)}
.btn.micbtn.on{background:var(--verde);color:#fff}
.btn.micbtn.mute{background:var(--tomate);color:#fff}
.me .who{font-size:14px;font-weight:700;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
.me.turn .who{background:var(--ouro);color:var(--tinta)}
.hand{display:flex;gap:10px;justify-content:center;padding-top:16px}
.hand .card{--cw:clamp(66px,23vw,98px)}
.cardbtn{border-radius:10px;transition:transform .15s}
.cardbtn.sel{transform:translateY(-16px)}
.actions{display:flex;gap:8px;justify-content:center;min-height:54px}
.actions .btn{flex:1}
.ask{text-align:center;font-size:16px;margin-bottom:6px}

/* cartas */
.card{--cw:56px;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.1);background:var(--creme);color:var(--tinta);
  position:relative;display:block;flex:none;font-family:var(--fd);
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35)}
.card.red{color:var(--naipe)}
.card .cr{position:absolute;left:8%;top:5%;font-size:calc(var(--cw)*.25);line-height:1;display:flex;flex-direction:column;align-items:center}
.card .cr i{font-style:normal;font-size:.8em;font-family:var(--fb)}
.card .cr.b{left:auto;right:8%;top:auto;bottom:5%;transform:rotate(180deg)}
.card .big{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.55);font-family:var(--fb)}
.card.man{box-shadow:0 0 0 2px var(--ouro),0 6px 14px rgba(0,0,0,.35)}
.card.man .cr.b{display:none}
.card .mn{position:absolute;left:0;right:0;bottom:0;font:700 calc(var(--cw)*.15)/1 var(--fb);background:var(--ouro);color:var(--tinta);
  text-align:center;padding:3px 0;border-radius:0 0 calc(var(--cw)*.1) calc(var(--cw)*.1)}
.card.back{background:repeating-linear-gradient(45deg,#7b2a24 0 6px,#a5352b 6px 12px);border:3px solid var(--creme)}
.play .card.glow-a{box-shadow:0 0 0 2px #f2c14e,0 0 14px 4px rgba(242,193,78,.85)}
.play .card.glow-r{box-shadow:0 0 0 2px #ff5a4d,0 0 14px 4px rgba(255,90,77,.9)}
.card.back.opp{background:repeating-linear-gradient(45deg,#1f3f66 0 6px,#2f5f94 6px 12px)}
.cuslist{display:flex;flex-wrap:wrap;gap:6px}
.cuslist .card{--cw:clamp(44px,13vw,60px)}
.pickgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pk{position:relative;padding:10px 0;border-radius:8px;background:var(--creme);color:var(--tinta);font-size:13px;font-weight:700;line-height:1}
.pk.red{color:#b3261e}
.pk.on{background:var(--ouro);outline:2px solid #fff}
.pk sup{font-size:9px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tbl{position:relative;aspect-ratio:1}
.tn{position:absolute;left:4px;top:2px;font-size:12px;font-weight:700;color:var(--creme2)}
.felt{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:radial-gradient(#3f8f4f,#2a6b38);border:3px solid #6b4a2a;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center}
.felt small{font-size:11px;color:#fff;line-height:1.15;overflow-wrap:anywhere}
.chair{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border-radius:50%;background:var(--creme2);border:3px solid var(--ouro);font-size:13px;font-weight:700;color:var(--tinta)}
.chair::after{content:'';position:absolute;inset:-8px}
.chair.b{border-color:var(--azul)}
.chair.on{background:var(--ouro)}
.chair.b.on{background:var(--azul);color:#fff}
.roomrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--madeira2);border-left:8px solid var(--ouro)}
.roomrow small{display:block;color:var(--creme2)}
.roomrow .btn{flex:none;width:auto;padding:10px 16px}

/* sobreposições */
.overlay{position:fixed;inset:0;background:rgba(20,10,6,.82);display:grid;place-items:center;padding:24px;z-index:20}
.box{background:var(--creme);color:var(--tinta);border-radius:20px;padding:26px 22px;text-align:center;max-width:360px;width:100%;display:grid;gap:14px}
.box h2{font-family:var(--fd);font-weight:400;font-size:34px;line-height:1}
.shout{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:clamp(44px,16vw,84px);
  color:var(--ouro);text-shadow:0 4px 0 #6b2a12,0 0 30px rgba(0,0,0,.65);z-index:30;pointer-events:none;white-space:nowrap;text-align:center;
  animation:shout 1.7s ease-out forwards}
.shout small{display:block;font-family:var(--fb);font-size:18px;color:var(--creme);text-shadow:0 2px 6px rgba(0,0,0,.8)}
@keyframes shout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}14%{transform:translate(-50%,-50%) scale(1.18);opacity:1}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--creme);color:var(--tinta);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;max-width:90vw;text-align:center}
.talk .who{box-shadow:0 0 0 2px #6fe3a2}
.talk .who::before{content:'● ';color:#6fe3a2}
.slot.talk{box-shadow:0 0 0 2px #6fe3a2}
/* chat */
.chatbtn{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700}
.btn.chatbtn{padding:13px 18px;font-size:17px;border-radius:12px;background:var(--creme2);color:var(--tinta)}
.cbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--tomate);color:#fff;font-size:11px;font-weight:700;text-align:center}
.cbadge:empty{display:none}
.chat-ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:35;background:rgba(20,10,6,.55);display:flex;align-items:flex-end;justify-content:center}
.chat-sheet{width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;gap:8px;background:var(--madeira2);border:2px solid var(--borda);border-bottom:0;border-radius:18px 18px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-log{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.chat-log:empty::before{content:'Ninguém falou ainda. Mande um alô para a mesa.';color:var(--creme2);font-size:14px;margin:auto;text-align:center}
.cm{align-self:flex-start;max-width:85%;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:12px;font-size:15px;overflow-wrap:anywhere}
.cm b{display:block;font-size:12px;color:var(--ouro)}
.cm.mine{align-self:flex-end;background:var(--creme);color:var(--tinta)}
.cm.mine b{color:#7a5a1a}
.cm.sys{align-self:center;background:none;color:var(--creme2);font-size:13px;text-align:center}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chat-quick button{flex:none;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:14px;font-weight:600}
.chat-form{display:flex;gap:8px}
.chat-form .btn{padding:12px 16px}
.face{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-size:24px;line-height:1;flex:none;font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif}
.face.on{background:var(--creme);animation:facein .2s ease-out}
@keyframes facein{from{transform:scale(.5)}}
.seat .face{width:24px;height:24px;font-size:15px}
.n6 .seat .face,.n8 .seat .face,.n10 .seat .face{width:20px;height:20px;font-size:12px}
.seatrow{display:flex;align-items:center;gap:3px}
.handrow{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.handrow .face{margin-bottom:6px}
.sigbtn{position:absolute;right:8px;bottom:8px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(20,8,4,.55);font-size:17px;line-height:1;opacity:.6;display:grid;place-items:center}
.sigbtn:active,.sigbtn.on{opacity:1;background:rgba(20,8,4,.85)}
.sigpop{position:absolute;right:8px;bottom:48px;z-index:6;background:var(--madeira2);border:2px solid var(--borda);border-radius:14px;padding:8px;display:grid;gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.5);max-width:calc(100% - 16px)}
.sigpop .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sigpop .eg button{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.1);font-size:26px;line-height:1;font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif}
.sigpop .eg button:active{background:var(--ouro)}
.sigpop .ft{display:flex;gap:6px;flex-wrap:wrap}
.sigpop .ft button{flex:1;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;white-space:nowrap}
.sigrow{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.sigrow select{width:auto;min-width:96px;padding:8px;border-radius:8px;border:2px solid var(--borda);background:#fff;color:var(--tinta);font:inherit;font-size:20px}
.sigrow .lab{font-weight:700;font-size:15px}
.sigrow .lab .r{color:var(--naipe)}
.sigchk{display:flex;align-items:center;gap:10px;text-align:left;font-size:15px;font-weight:700}
.sigchk input{width:22px;height:22px;flex:none;padding:0}
.cola{display:grid;gap:6px;text-align:left}
.cola .pl{font-weight:700;color:#7a5a1a}
.cola .it{display:flex;align-items:center;gap:8px;font-size:15px}
.cola .it .e{font-size:24px;font-family:system-ui,'Apple Color Emoji','Segoe UI Emoji',sans-serif}
.cola .r{color:var(--naipe)}

<body>
<div id="app"></div>
<script>
(() => {
'use strict';

/* ================= Regras e cartas ================= */
const PREFIX = 'trucomg-';
const SUITS = { P:{s:'♣\uFE0E',red:0,n:'paus'}, C:{s:'♥\uFE0E',red:1,n:'copas'}, E:{s:'♠\uFE0E',red:0,n:'espadas'}, O:{s:'♦\uFE0E',red:1,n:'ouros'} };
const RANKS = ['4','5','6','7','Q','J','K','A','2','3'];           // baralho de 40 (sem 8, 9 e 10)
const MAN = { '4P':'Zap', '7C':'Copas', 'AE':'Espadilha', '7O':'Ouros', '4E':'Rato', '7P':'Rato',
  'CORINGA':'Coringa', 'LETRADO':'Letrado', '9P':'Trucão', '10O':'Trucão', '10C':'Trucão', '10E':'Trucão', '10P':'Trucão', '9O':'Trucão', '8O':'Trucão' };  // etiquetas das cartas fortes (4E/7P só no 7 rato; o resto só no Trucão)
const SPECIAL = { CORINGA:{n:'Coringa',g:'★\uFE0E'}, LETRADO:{n:'Letrado',g:'L'} };
const ORD = { '3':9,'2':8,'A':7,'K':6,'J':5,'Q':4,'7':3,'6':2,'5':1,'4':0 };
let RATO = false;                                    // modo 7 rato: 4♠ e 7♣ ficam acima do Zap
const RATO_TOP = { '7P':15, '4E':14 };               // 7 de paus mata tudo, depois 4 de espadas, depois o Zap
let CUSTOM = null;                                   // modo personalizado: lista das cartas mais fortes (a primeira é a mais forte)
let TRUCAO = false;                                  // modo Trucão: cartas extras acima do Zap
const TRUCAO_TOP = { CORINGA:30, LETRADO:29, '9P':28, '10O':27, '10C':26, '10E':25, '10P':24, '9O':23, '8O':22 };
const pw = id => CUSTOM ? (CUSTOM.includes(id) ? 10+CUSTOM.length-1-CUSTOM.indexOf(id) : ORD[id.slice(0,-1)]) : (TRUCAO && TRUCAO_TOP[id]) || (RATO && RATO_TOP[id]) || (id==='4P'?13 : id==='7C'?12 : id==='AE'?11 : id==='7O'?10 : ORD[id.slice(0,-1)]);
const setVar = (v,c) => { RATO=v==='rato'; TRUCAO=v==='trucao'; CUSTOM=v==='custom'?(c||[]):null; };
const isMan = id => pw(id) >= 10;
const NEXT = { 2:4, 4:8, 8:12 };                 // valor da mão: 2 → Truco 4 → Seis 8 → Doze 12
const CALL = { 4:'Truco', 8:'Seis', 12:'Doze' };
const team = s => s % 2;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => {                                   // sorteio de verdade (crypto), com Math.random de reserva
  try { const a=new Uint32Array(1); crypto.getRandomValues(a); return Math.floor(a[0]/4294967296*n); }
  catch(e){ return Math.floor(Math.random()*n); }
};
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const makeDeck = () => { const d=[]; for (const s of Object.keys(SUITS)) for (const r of RANKS) d.push(r+s); if (TRUCAO) d.push('CORINGA','LETRADO','9P','10O','10C','10E','10P','9O','8O'); return d; };
const BOT_NAMES = ['Zé do Truco','Tião','Dona Lourdes','Sô Geraldo','Nega Maria','Seu Tonico','Tia Zica','Nhô Tonho','Sinhá','Compadre Dito'];
const cleanName = n => (n||'').trim().slice(0,14) || 'Jogador';

function handWinner(r, maoTeam){
  if (r.length < 2) return null;
  const [a,b,c] = r;
  if (a>=0 && b===a) return a;
  if (a===-1 && b>=0) return b;
  if (a>=0 && b===-1) return a;
  if (r.length < 3) return null;
  if (a>=0 && b>=0 && a!==b) return c>=0 ? c : a;
  if (a===-1 && b===-1) return c>=0 ? c : maoTeam;
  return null;
}

/* ================= Estado do cliente ================= */
let peer=null, role=null, myName='', roomCode='', conns={}, hostConn=null;
let view=null, selected=-1, lastShout=null, firstView=true, prevTable=[], prevMine=false;
let nameVal='', codeVal='';
try { nameVal = localStorage.getItem('trucomg-nome') || ''; } catch(e){}
try { codeVal = (new URLSearchParams(location.search).get('sala')||'').toUpperCase(); } catch(e){}

/* ================= Motor (roda no anfitrião) ================= */
let S=null, botTimer=null, planTimer=null, shoutN=0;
const PLAN_MS = 120000;                              // tempo para cada time combinar a jogada (2 minutos)
const name = s => S.seats[s].name;
const seatsOf = t => S.seats.map((_,i)=>i).filter(i => i%2===t);
const teamName = t => seatsOf(t).map(name).join(' e ');
const nextBotName = () => BOT_NAMES.find(n => !S.seats.some(s=>s.name===n)) || ('Robô '+Math.floor(Math.random()*90+10));

const EMOTES=['😀','😎','😏','😬','😮','🤨','😤','🥱','🤫','🙄','😴','😈'];
const EMO_MS=4000;                                   // tempo que a carinha fica no ar antes de voltar ao neutro
let emoT={}, emoLast={};
function emoReset(){ Object.keys(emoT).forEach(k=>clearTimeout(emoT[k])); emoT={}; emoLast={}; if (S){ S.emo={}; } }
const SIG_ID=/^(?:[4567QJKA23][PCEO]|CORINGA|LETRADO|(?:8|9|10)[PCEO])$/;
function cleanSinais(m){                             // valida o mapa carta → emote que veio da rede
  const out={}; if (!m || typeof m!=='object') return out;
  let n=0;
  for (const k of Object.keys(m)){ if (n>=20) break; if (SIG_ID.test(k) && EMOTES.includes(m[k])){ out[k]=m[k]; n++; } }
  return out;
}
function emoBroadcast(seat, e){                      // manda a carinha direto a todos os humanos, sem reenviar o estado todo
  S.seats.forEach((o,j)=>{
    if (j===seat || o.kind!=='human') return;
    if (o.cid==='host') showEmote(seat,e);
    else { const c=conns[o.cid]; if (c && c.open) c.send({t:'emote',seat,e}); }
  });
}
function emoteIn(seat, e){
  if (!S || !S.hand || S.phase==='lobby' || S.phase==='plan') return;
  const t=S.seats[seat]; if (!t || t.kind!=='human' || !EMOTES.includes(e)) return;
  const now=Date.now(); if (now-(emoLast[t.cid]||0)<250) return; emoLast[t.cid]=now;
  // robôs do mesmo time entendem o sinal do parceiro (se o mapa dele é conhecido)
  const map = t.cid==='host' ? sigGet() : (S.sinais && S.sinais[t.cid]);
  if (map){ const card=Object.keys(map).find(k=>map[k]===e && isMan(k)); if (card){ S.hand.psig=S.hand.psig||{}; S.hand.psig[seat]=card; } }
  emoBroadcast(seat,e);
}
function partnerPower(seat){                         // força da carta forte que um parceiro humano sinalizou e ainda tem na mão
  const H=S.hand; let best=0;
  if (!H || !H.psig) return 0;
  Object.keys(H.psig).forEach(k=>{ const j=+k, c=H.psig[k]; if (j%2===seat%2 && H.hands[j] && H.hands[j].includes(c)) best=Math.max(best,pw(c)); });
  return best;
}
function botMap(seat){                               // sinais usados pelo robô: os do parceiro humano do time dele
  const hs=S.seats.findIndex((x,i)=>i%2===seat%2 && x.kind==='human'); if (hs<0) return null;
  const cid=S.seats[hs].cid;
  if (cid==='host') return sigGet();
  return (S.sinais && S.sinais[cid]) || Object.assign({},DEFAULT_SINAIS);
}
function botSignal(seat){
  const H=S&&S.hand; if (!H || H.over || S.phase!=='play' || H.tenPending) return;
  const map=botMap(seat); if (!map) return;
  const cards=H.hands[seat].filter(c=>isMan(c) && map[c]).sort((a,b)=>pw(b)-pw(a));
  if (cards.length) emoBroadcast(seat,map[cards[0]]);
}
function botsSignalAll(){ if (S && S.hand) S.seats.forEach((x,i)=>{ if (x.kind==='bot') botSignal(i); }); }
function sinaisIn(seat, share, map){
  if (!S) return;
  const t=S.seats[seat]; if (!t || t.kind!=='human') return;
  if (!S.sinais) S.sinais={};
  if (share) S.sinais[t.cid]=cleanSinais(map); else delete S.sinais[t.cid];
  pushState();
}
function newMatch(mode){
  emoReset();
  S = { emo:{}, sinais:{}, phase:'lobby', variant:'normal', custom:['4P','7C','AE','7O'], mode, seats:[], scores:[0,0], dealer:0, hand:null, msg:'', shout:null, winnerTeam:null, handEnd:null, seriesTarget:1, seriesWins:[0,0], matchNo:1, hand10Callers:[] };
}
function resetSeats(mode, humans){
  S.mode = mode;
  S.seats = humans.slice(0, mode);
  while (S.seats.length < mode) S.seats.push({ kind:'bot', name:nextBotName() });
}
function startPlan(){
  clearTimeout(botTimer); clearTimeout(planTimer);
  setVar(S.variant,S.custom);
  S.phase='plan'; S.planEnd=Date.now()+PLAN_MS; S.msg='';
  planTimer=setTimeout(()=>{ if(S.phase==='plan') startMatch(); }, PLAN_MS);
  pushState();
}
function startMatch(){
  clearTimeout(botTimer); clearTimeout(planTimer);
  setVar(S.variant,S.custom);
  S.scores=[0,0]; S.winnerTeam=null; S.handEnd=null; S.hand10CallerTeam=null;
  S.dealer = rnd(S.mode);
  startHand();
}
function startHand(){
  const n=S.mode;
  S.dealer = (S.dealer+1) % n;
  const mao = (S.dealer+1) % n;
  const deck = shuffle(makeDeck());
  const hands=[]; for (let i=0;i<n;i++) hands.push(deck.splice(0,3));   // cartas na ordem em que saíram, sem arrumar
  // Ajuste leve de probabilidade: cerca de 20% das manilhas distribuídas
  // são trocadas por cartas comuns que ainda ficaram no monte. O baralho
  // continua completo e a mesma chance vale para todos os jogadores.
  for (const hand of hands) {
    for (let j=0; j<hand.length; j++) {
      if (isMan(hand[j]) && rnd(100) < 20) {
        const comuns=[];
        for (let k=0; k<deck.length; k++) if (!isMan(deck[k])) comuns.push(k);
        if (comuns.length) {
          const k=comuns[rnd(comuns.length)];
          [hand[j],deck[k]]=[deck[k],hand[j]];
        }
      }
    }
  }
  S.hand = { hands, table:[], lastTable:null, results:[], value:2, lastRaiser:-1, pending:null, mao, leader:mao, turn:mao, resolving:false, over:false, hand10Callers:[] };
  S.phase='play'; S.handEnd=null; S.shout=null;
  S.msg = name(mao)+' começa a mão.';
  const t10=[0,1].filter(t=>S.scores[t]===10);
  if (t10.length===1){ S.hand.tenPending={team:t10[0]}; S.msg='Mão de 10! '+teamName(t10[0])+' decide se joga ou não.'; }
  pushState(); scheduleBots();
  const H0=S.hand; setTimeout(()=>{ if (S && S.hand===H0 && !H0.over) botsSignalAll(); }, 1800);
}
const tp=p=>p.hidden?-1:pw(p.card);
function playCard(seat, idx, hide){
  const H=S.hand;
  if (!H || S.phase!=='play' || H.turn!==seat || H.pending || H.resolving || H.tenPending) return;
  const card=H.hands[seat][idx]; if(!card) return;
  if (hide && H.results.length<1) return;          // esconder só a partir da 2ª rodada
  H.hands[seat].splice(idx,1);
  H.table.push({seat,card,hidden:!!hide});
  if (hide) S.msg=name(seat)+' escondeu a carta.';
  if (H.table.length===S.mode){ H.turn=-1; H.resolving=true; pushState(); setTimeout(resolveTrick,1400); }
  else { H.turn=(seat+1)%S.mode; pushState(); scheduleBots(); }
}
function resolveTrick(){
  const H=S.hand; if(!H||H.over||S.phase!=='play') return;
  let best=-1, tops=[];
  H.table.forEach(p=>{ const w=tp(p); if(w>=best){best=w;tops=[p];} });  // carta igual não empata: a última jogada vence (todos os modos)
  const teams=new Set(tops.map(p=>team(p.seat)));
  let wt, next;
  if (teams.size===1){ wt=[...teams][0]; next=tops[0].seat; } else { wt=-1; next=H.leader; }
  H.results.push(wt); H.leader=next; H.resolving=false;
  const w=handWinner(H.results, team(H.mao));
  if (w!==null){ endHand(w,H.value,'nas cartas'); return; }
  H.lastTable=H.table; H.table=[]; H.turn=next;
  setTimeout(()=>{ if (S && S.hand===H && !H.over) botsSignalAll(); }, 700);
  S.msg = wt===-1 ? 'Embuchou! A rodada empatou.' : teamName(wt)+' levou a rodada.';
  pushState(); scheduleBots();
}
function tenRule(seat){                              // true se a regra dos 10 pontos está valendo (qualquer time com 10)
  return !!S && (S.scores[0]===10 || S.scores[1]===10);
}
function penaltyByTen(seat, verb){                  // com um time em 10, quem pede/aumenta truco dá 4 pontos ao outro time
  const H=S.hand; H.pending=null; clearTimeout(botTimer);
  endHand(1-team(seat), 4, 'regra dos 10 pontos: '+name(seat)+' '+verb+' truco');
}
function endHand(wt, pts, how){
  const H=S.hand; H.over=true; H.turn=-1; H.pending=null; H.resolving=false;
  S.scores[wt]=Math.min(12, S.scores[wt]+pts);
  S.handEnd={team:wt,pts};
  S.msg = teamName(wt)+' ganhou '+pts+' ponto'+(pts>1?'s':'')+' ('+how+').';
  if (S.scores[wt]>=12){ S.phase='over'; S.winnerTeam=wt; S.seriesWins[wt]=(S.seriesWins[wt]||0)+1; pushState(); return; }
  S.phase='handEnd'; pushState();
  setTimeout(()=>{ if(S.phase==='handEnd') startHand(); }, 3400);
}
function shout(seat, text, clip){
  const ok = typeof clip==='string' && clip.startsWith('data:audio/') && clip.length<120000;
  S.shout={ id:++shoutN, text, name:name(seat), clip: ok ? clip : null };
}
function callTruco(seat, clip){
  const H=S.hand;
  if (!H || S.phase!=='play' || H.turn!==seat || H.pending || H.resolving || H.tenPending) return;
  const nv=NEXT[H.value]; if(!nv || H.lastRaiser===team(seat)) return;
  if (tenRule(seat)){ shout(seat, CALL[nv]+'!', clip); penaltyByTen(seat,'pediu'); return; }
  H.pending={ from:seat, team:team(seat), toValue:nv, resp:(seat+1)%S.mode };
  shout(seat, CALL[nv]+'!', clip); S.msg=name(seat)+' pediu '+CALL[nv]+'!';
  pushState(); scheduleBots();
}
function respond(seat, act, clip){
  const H=S.hand, P=H&&H.pending;
  if (!P || S.phase!=='play' || team(seat)===P.team) return;
  if (act==='run'){ shout(seat,'Corro!'); H.pending=null; endHand(P.team,H.value,'o outro lado correu'); return; }
  if (act!=='accept' && act!=='raise') return;
  if (act==='raise' && NEXT[P.toValue] && tenRule(seat)){ shout(seat, CALL[NEXT[P.toValue]]+'!', clip); penaltyByTen(seat,'aumentou o'); return; }
  H.value=P.toValue; H.lastRaiser=P.team; H.pending=null;
  const nv=NEXT[H.value];
  if (act==='raise' && nv){
    H.pending={ from:seat, team:team(seat), toValue:nv, resp:(seat+1)%S.mode };
    shout(seat, CALL[nv]+'!', clip); S.msg=name(seat)+' aumentou: '+CALL[nv]+'!';
  } else {
    shout(seat,'Aceito!'); S.msg=name(seat)+' aceitou. A mão vale '+H.value+'.';
  }
  pushState(); scheduleBots();
}
function tenDecide(seat, play){
  const H=S.hand; if (!H || !H.tenPending || S.phase!=='play' || team(seat)!==H.tenPending.team) return;
  const t=H.tenPending.team; H.tenPending=null;
  if (play){ H.value=4; S.msg=teamName(t)+' vai jogar a mão de 10. A mão vale 4: se perder, o outro time leva 4.'; pushState(); scheduleBots(); }
  else endHand(1-t, 2, 'o time de 10 não quis jogar');
}
function handleAction(seat, a){
  if (!S || !a) return;
  if (S.phase==='plan'){ if (a.k==='go' && S.seats[seat].cid==='host') startMatch(); return; }
  if (S.phase==='lobby'){
    if (a.k==='sit'){ const j=a.i|0, t=S.seats[j]; if (t && t.kind==='bot'){ S.seats[j]=S.seats[seat]; S.seats[seat]=t; pushState(); } return; }
    if (S.seats[seat].cid!=='host') return;
    if (a.k==='mode'){ if(![2,4,6,8,10].includes(a.m)) return; const humans=S.seats.filter(s=>s.kind==='human'); if(humans.length>a.m){ toast('Tem mais gente na sala do que lugares.'); return; } resetSeats(a.m, humans); pushState(); }
    else if (a.k==='variant'){ if(!['normal','rato','trucao','custom'].includes(a.v)) return; S.variant=a.v; setVar(a.v,S.custom); pushState(); }
    else if (a.k==='pick'){ const c=String(a.c); if(!/^[4567QJKA23][PCEO]$/.test(c)) return; const i=S.custom.indexOf(c); if (i>=0) S.custom.splice(i,1); else if (S.custom.length<12) S.custom.push(c); setVar(S.variant,S.custom); pushState(); }
    else if (a.k==='cpreset'){ S.custom=['4P','7C','AE','7O']; setVar(S.variant,S.custom); pushState(); }
    else if (a.k==='cclear'){ S.custom=[]; setVar(S.variant,S.custom); pushState(); }
    else if (a.k==='shuffle'){ S.seats=shuffle(S.seats); pushState(); }
    else if (a.k==='series'){ const n=Math.max(1,Math.min(99,parseInt(a.n,10)||1)); S.seriesTarget=n; pushState(); }
    else if (a.k==='start'){ S.seriesWins=[0,0]; S.matchNo=1; const hum=S.seats.filter(s=>s.kind==='human').length; if (roomCode && hum>=2) startPlan(); else startMatch(); }
    return;
  }
  if (a.k==='tenplay'||a.k==='tenrun'){ tenDecide(seat, a.k==='tenplay'); return; }
  if (a.k==='play') playCard(seat, a.i|0, !!a.hide);
  else if (a.k==='truco') callTruco(seat, a.clip);
  else if (a.k==='accept'||a.k==='run'||a.k==='raise') respond(seat, a.k, a.clip);
  else if (a.k==='rematch' && S.phase==='over' && S.seats[seat].cid==='host') { const done=(S.seriesWins||[0,0]).some(w=>w>=S.seriesTarget); if (!done) S.matchNo++; else { S.matchNo=1; S.seriesWins=[0,0]; } startMatch(); }
}

/* ---- Robôs ---- */
function scheduleBots(){
  clearTimeout(botTimer);
  if (!S || !S.hand || S.phase!=='play') return;
  const H=S.hand; if (H.resolving||H.over) return;
  if (H.tenPending){
    const t=H.tenPending.team;
    if (seatsOf(t).every(x=>S.seats[x].kind==='bot')) botTimer=setTimeout(()=>{
      if (!S.hand || !S.hand.tenPending) return;
      const cs=teamCards(t), sc=(cs[0]||0)+(cs[1]||0)*.5+(cs[2]||0)*.25;
      const thr = S.scores[1-t]>=8 ? 16 : 11;                       // perder a mão pode custar a partida se o rival já está perto
      tenDecide(seatsOf(t)[0], sc>=thr || Math.random()<.1);
    },1600);
    return;
  }
  if (H.pending){
    const P=H.pending;
    if (seatsOf(1-P.team).every(s=>S.seats[s].kind==='bot')) botTimer=setTimeout(()=>botRespond(P.resp),1500);
    return;
  }
  if (S.seats[H.turn] && S.seats[H.turn].kind==='bot') botTimer=setTimeout(()=>botTurn(H.turn),1100);
}
function teamCards(t){ return seatsOf(t).flatMap(x=>S.hand.hands[x].map(c=>Math.min(pw(c),13))).sort((a,b)=>b-a); }
function botTurn(seat){
  const H=S.hand;
  if (!H || H.turn!==seat || H.pending || H.resolving || H.tenPending || S.phase!=='play') return;
  const hand=H.hands[seat], t=team(seat), ot=1-t;
  const bp=c=>Math.min(pw(c),13);
  const strong=hand.filter(c=>bp(c)>=9).length;
  const round=H.results.length, wonFirst=H.results[0]===t, lostFirst=H.results[0]===ot;
  const ws=hand.map(bp).sort((a,b)=>b-a);
  const pb=partnerPower(seat);
  // --- pedir truco: força da mão, situação da rodada, placar e sinal do parceiro
  if (NEXT[H.value] && H.lastRaiser!==t && !tenRule(seat)){
    const sc=(ws[0]||0)+(ws[1]||0)*.5+(pb>=10?3:0);
    let p = round===0 ? (sc>=20?.40 : sc>=16?.22 : sc>=13?.08 : .03)
          : hand.length===1 ? ((ws[0]>=12 && !lostFirst)?.55 : ws[0]>=9?.15 : .04)
          : wonFirst ? (sc>=14?.45 : sc>=10?.22 : .07)
          : lostFirst ? (ws[0]>=12 && ws[1]>=9 ? .35 : .02)
          : (sc>=13?.30 : .08);                       // embuchou: quem tem carta forte aperta
    if (S.scores[ot]-S.scores[t]>=6) p*=1.4;           // atrás no placar arrisca mais
    if (S.scores[t]-S.scores[ot]>=6) p*=.7;            // na frente joga seguro
    if (H.value>=8) p*=.4;
    if (Math.random()<p){ callTruco(seat); return; }
  }
  // --- escolher a carta
  const sorted=hand.map((c,i)=>({c,i,w:pw(c)})).sort((a,b)=>a.w-b.w);
  let pick, hide=false;
  if (H.table.length===0){
    if (round===0){
      if (strong>=2) pick=sorted.find(x=>bp(x.c)>=9) || sorted[0];   // duas fortes: sai com a mais fraca delas e guarda a melhor
      else if (strong===1) pick=sorted[Math.min(1,sorted.length-1)];  // uma forte: isca no meio
      else pick=sorted[sorted.length-1];                              // mão fraca: tenta a primeira com a melhor
    } else pick=sorted[sorted.length-1];                              // já ganhou, perdeu ou embuchou: fecha com a melhor
  } else {
    const top=Math.max(...H.table.map(tp));
    const eq=H.table.filter(p=>tp(p)===top), topSeat=eq[eq.length-1].seat;
    if (team(topSeat)===t) pick=sorted[0];                            // parceiro está ganhando: joga a menor
    else {
      const win=sorted.find(x=>x.w>=top);                             // a menor carta que vence (igual vence por ser a última)
      if (win) pick=win;
      else { pick=sorted[0]; if (round>=1 && Math.random()<.5) hide=true; }  // não dá para ganhar: joga a menor, às vezes escondida
    }
  }
  playCard(seat, pick.i, hide);
}
function botRespond(seat){
  const H=S.hand, P=H&&H.pending;
  if (!P || S.phase!=='play') return;
  const rt=team(seat), ot=1-rt;
  const cs=teamCards(rt);                                             // a dupla robô combina a conversa: usa as melhores cartas do time
  let score=(cs[0]||0)+(cs[1]||0)*.5;
  if (partnerPower(seat)>=10) score+=3;
  let thr = P.toValue>=8 ? 10 : 7;
  if (H.results[0]===rt) thr-=2.5; else if (H.results[0]===ot) thr+=1.5;
  if (H.results.length>=2 && H.results[1]===rt) thr-=1;
  if (S.scores[ot]+H.value>=12) thr-=3;                               // correr já dá a partida ao adversário: luta mais
  const r=Math.random();
  if (score>=thr+6 && NEXT[P.toValue] && r<.45 && !tenRule(seat)) respond(seat,'raise');
  else if (score>=thr || r<.12) respond(seat,'accept');
  else respond(seat,'run');
}

/* ---- Visões e rede (anfitrião) ---- */
function makeView(seat){
  const H=S.hand, n=S.mode;
  const base={ phase:S.phase, mode:n, mySeat:seat, code:roomCode, pub:pubRoom, isHost:S.seats[seat].cid==='host',
    seats:S.seats.map((s,i)=>({name:s.name,kind:s.kind,you:i===seat,pid:s.kind==='human'?(s.cid==='host'?PREFIX+roomCode:s.cid):null})),
    scores:S.scores.slice(), seriesTarget:S.seriesTarget||1, seriesWins:(S.seriesWins||[0,0]).slice(), matchNo:S.matchNo||1, hand10Callers:S.hand&&S.hand.hand10Callers, msg:S.msg||'', shout:S.shout?{id:S.shout.id,text:S.shout.text,name:S.shout.name,clip:S.shout.clip||null}:null, winnerTeam:S.winnerTeam, variant:S.variant, custom:S.custom.slice(),
    ten:tenRule(),
    colinha:S.seats.map((s,i)=>({s,i})).filter(x=>x.i!==seat && x.i%2===seat%2).map(x=>{ if (x.s.kind==='human') return (S.sinais&&S.sinais[x.s.cid]) ? {name:x.s.name,map:S.sinais[x.s.cid]} : null; const m=botMap(x.i); return m?{name:x.s.name,map:m}:null; }).filter(Boolean),
    plan: S.phase==='plan' ? { left:Math.max(0,(S.planEnd||0)-Date.now()) } : null,
    peers:S.seats.map((s,i)=>({s,i})).filter(x=>x.s.kind==='human' && (S.phase!=='plan' || x.i%2===seat%2)).map(x=>x.s.cid==='host'?PREFIX+roomCode:x.s.cid) };
  if (S.phase==='lobby' || S.phase==='plan' || !H) return base;
  const t=team(seat);
  const myTurn = H.turn===seat && !H.pending && !H.resolving && !H.tenPending && S.phase==='play';
  const nv=NEXT[H.value]||0;
  const P=H.pending;
  return Object.assign(base,{
    hand:H.hands[seat].slice(), counts:H.hands.map(h=>h.length),
    table:H.table.map(p=>p.hidden?{seat:p.seat,card:null,hidden:true}:{seat:p.seat,card:p.card}),
    results:H.results.slice(), turn:H.turn, myTurn, myTeam:t, value:H.value, nextValue:nv,
    canTruco: !!(myTurn && nv && H.lastRaiser!==t),
    canHide: !!(myTurn && H.results.length>=1),
    tenChoice: H.tenPending ? { team:H.tenPending.team, canDecide:team(seat)===H.tenPending.team } : null,
    pending: P ? { from:P.from, team:P.team, toValue:P.toValue, canRespond:team(seat)!==P.team, raiseTo:NEXT[P.toValue]||0 } : null,
    handEnd:S.handEnd
  });
}
function pushState(){
  if (!S) return;
  S.seats.forEach((s,i)=>{
    if (s.kind!=='human') return;
    const v=makeView(i);
    if (s.cid==='host'){ setView(v); render(); }
    else { const c=conns[s.cid]; if(c && c.open) c.send({t:'state',v}); }
  });
  if (S.shout) S.shout.clip=null;     // a gravação só viaja uma vez
}
function dropGuest(cid){
  const i=S&&S.seats.findIndex(s=>s.cid===cid);
  if (i==null || i<0) return;
  delete conns[cid];
  if (S.sinais) delete S.sinais[cid]; if (S.emo) delete S.emo[cid];
  const old=S.seats[i].name;
  S.seats[i]={ kind:'bot', name: S.phase==='lobby' ? nextBotName() : old+' (robô)' };
  pushState(); scheduleBots();
}
function onGuestConn(conn){
  conn.on('data', m=>{
    if (!m) return;
    if (m.t==='hello'){
      if (S.phase!=='lobby'){ conn.send({t:'err',m:'A partida já começou.'}); setTimeout(()=>conn.close(),400); return; }
      const w=m.seat|0, i=(S.seats[w]&&S.seats[w].kind==='bot')?w:S.seats.findIndex(s=>s.kind==='bot');
      if (i<0){ conn.send({t:'err',m:'A sala está cheia.'}); setTimeout(()=>conn.close(),400); return; }
      conns[conn.peer]=conn;
      S.seats[i]={ kind:'human', cid:conn.peer, name:cleanName(m.name) };
      pushState();
    } else if (m.t==='chat'){
      chatIn(conn.peer, m.text);
    } else if (m.t==='act'){
      const i=S.seats.findIndex(s=>s.cid===conn.peer);
      if (i>=0) handleAction(i,m.a);
    } else if (m.t==='emote'){
      const i=S.seats.findIndex(s=>s.cid===conn.peer);
      if (i>=0) emoteIn(i,m.e);
    } else if (m.t==='sinais'){
      const i=S.seats.findIndex(s=>s.cid===conn.peer);
      if (i>=0) sinaisIn(i,!!m.share,m.map);
    }
  });
  conn.on('close',()=>dropGuest(conn.peer));
  conn.on('error',()=>dropGuest(conn.peer));
}

/* ================= Conexão ================= */
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function saveName(){ try{ localStorage.setItem('trucomg-nome', myName); }catch(e){} }
function goHome(){
  role=null;
  roomsStop(); dirStop(); pubRoom=false;
  stopVoice();
  clearTimeout(botTimer);
  try{ peer && peer.destroy(); }catch(e){}
  chatReset(); peer=null; S=null; conns={}; hostConn=null; view=null; firstView=true; lastShout=null; selected=-1; prevTable=[]; sigOpen=false; sigSentKey=''; emoReset(); emoClear();
  renderHome();
}
function playSolo(){
  myName=cleanName(nameVal); saveName();
  try{ peer && peer.destroy(); }catch(e){}
  peer=null; role='host'; conns={}; roomCode='';
  newMatch(4);
  S.seats=[{kind:'human',cid:'host',name:myName}];
  resetSeats(4,S.seats);
  pushState();
}
function createRoom(pub,want){
  myName=cleanName(nameVal); saveName(); pubRoom=!!pub;
  const attempt=n=>{
    roomCode=genCode();
    busy('Abrindo a sala…');
    peer=new Peer(PREFIX+roomCode);
    peer.on('open',()=>{
      role='host'; conns={};
      newMatch(4);
      S.seats=[{kind:'human',cid:'host',name:myName}];
      resetSeats(4,S.seats);
      if (want>0 && want<4){ const t=S.seats[want]; S.seats[want]=S.seats[0]; S.seats[0]=t; }
      pushState();
      if (pubRoom) dirStart();
    });
    peer.on('connection',onGuestConn);
    peer.on('call',onCall);
    peer.on('error',e=>{
      if (e.type==='unavailable-id' && n<5){ try{peer.destroy();}catch(_){} attempt(n+1); return; }
      toast('Não deu pra abrir a sala ('+(e.type||'erro')+').'); goHome();
    });
  };
  attempt(0);
}
function joinRoom(c,want){
  myName=cleanName(nameVal); saveName();
  const code=(c||codeVal||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length<4){ toast('Digite o código da sala.'); return; }
  busy('Entrando na sala…');
  let joined=false;
  peer=new Peer();
  peer.on('call',onCall);
  peer.on('open',()=>{
    hostConn=peer.connect(PREFIX+code,{reliable:true});
    const to=setTimeout(()=>{ if(!joined){ toast('Sala não encontrada.'); goHome(); } },12000);
    hostConn.on('open',()=>{ joined=true; clearTimeout(to); role='guest'; hostConn.send({t:'hello',name:myName,seat:want}); });
    hostConn.on('data',m=>{
      if (m.t==='state'){ setView(m.v); render(); }
      else if (m.t==='chat') chatShow(m);
      else if (m.t==='emote') showEmote(m.seat,m.e);
      else if (m.t==='err'){ toast(m.m); goHome(); }
    });
    hostConn.on('close',()=>{ if(role==='guest'){ toast('O anfitrião saiu da sala.'); goHome(); } });
  });
  peer.on('error',e=>{ toast(e.type==='peer-unavailable' ? 'Sala não encontrada.' : 'Erro de conexão ('+(e.type||'?')+').'); goHome(); });
}
let emoNow={}, emoClient={};
function paintFace(seat){ document.querySelectorAll('[data-face="'+seat+'"]').forEach(el=>{ const e=emoNow[seat]; el.textContent=e||'😐'; el.classList.toggle('on',!!e); }); }
function showEmote(seat,e){
  emoNow[seat]=e; clearTimeout(emoClient[seat]); paintFace(seat);
  emoClient[seat]=setTimeout(()=>{ delete emoNow[seat]; paintFace(seat); }, EMO_MS);
}

const DIR_ID=PREFIX+'salas';
let pubRoom=false, dirHost=null, dirRooms={}, dirLink=null, dirTmp=null, dirTimer=null, dirBusy=false;

function dirList(){

function dirServe(){
  if (dirHost) return;

  d.on('connection',c=>{
    c.on('data',m=>{
      if (!m) return;

        dirRooms[m.r.code]={ts:Date.now(), r:{code:m.r.code,name:cleanName(m.r.name),mode:m.r.mode|0,humans:m.r.humans|0,seats:Array.isArray(m.r.seats)?m.r.seats.slice(0,10).map(x=>x?cleanName(x):null):[],open:!!m.r.open}};
      else if (m.t==='unreg') delete dirRooms[m.code];
      else if (m.t==='list') c.send({t:'rooms',rooms:dirList()});

  });

function dirBeat(){
  if (!dirTimer || !S) return;
  const r=roomInfo();
  if (dirHost){ dirRooms[r.code]={r,ts:Date.now()}; return; }
  if (dirLink && dirLink.open){ dirLink.send({t:'reg',r}); return; }
  if (dirBusy) return; dirBusy=true; setTimeout(()=>{ dirBusy=false; },4000);
  try{ dirTmp&&dirTmp.destroy(); }catch(e){}
  const tmp=new Peer(); dirTmp=tmp;

    const c=tmp.connect(DIR_ID,{reliable:true});

    c.on('close',()=>{ if (dirLink===c) dirLink=null; });
  });
  tmp.on('error',e=>{
    if (e.type==='peer-unavailable') setTimeout(()=>{ if (dirTimer && !dirHost) dirServe(); }, Math.random()*1500);
  });
}
function dirStart(){ dirStop(); dirTimer=setInterval(dirBeat,5000); dirBeat(); }

/* ================= Voz (áudio entre jogadores) ================= */
let myStream=null, micOn=false, outCalls={}, inCalls={}, audios={};
let actx=null, meters={}, talking=new Set(), autoMic=false;
function meterAdd(id,stream){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state==='suspended') actx.resume().catch(()=>{});
    meterDrop(id);
    const src=actx.createMediaStreamSource(stream), an=actx.createAnalyser(); an.fftSize=512;
    src.connect(an); meters[id]={src,an,buf:new Uint8Array(an.fftSize)};
  }catch(e){}
}
function meterDrop(id){ const m=meters[id]; if (m){ try{ m.src.disconnect(); }catch(e){} delete meters[id]; } talking.delete(id); }
setInterval(()=>{
  if (!view || !view.seats) return;
  const mine=peer&&peer.id; talking=new Set();
  Object.keys(meters).forEach(id=>{
    if (id===mine && !micOn) return;
    const m=meters[id]; m.an.getByteTimeDomainData(m.buf);
    let mx=0; for (let i=0;i<m.buf.length;i++){ const d=Math.abs(m.buf[i]-128); if (d>mx) mx=d; }
    if (mx>10) talking.add(id);
  });
  document.querySelectorAll('[data-pid]').forEach(el=>el.classList.toggle('talk',talking.has(el.dataset.pid)));
},200);
function wire(c,id){
  c.on('stream',s=>playRemote(id,s));
  const drop=()=>{ if(outCalls[id]===c) delete outCalls[id]; if(inCalls[id]===c) delete inCalls[id]; };
  c.on('close',drop); c.on('error',drop);
}
function playRemote(id,s){
  let a=audios[id];
  if (!a){ a=document.createElement('audio'); a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); audios[id]=a; }
  a.srcObject=s; meterAdd(id,s);
  try{ const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
}
function unlockAudio(){ try{ actx&&actx.state==='suspended'&&actx.resume(); }catch(e){} Object.keys(audios).forEach(id=>{ try{ const pr=audios[id].play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} }); }
function onCall(c){
  inCalls[c.peer]=c;
  try{ c.answer(myStream||undefined); }catch(e){}
  if (myStream) outCalls[c.peer]=c;
  wire(c,c.peer);
}
function callAll(){
  if (!peer || !myStream || !view || !view.peers) return;
  view.peers.forEach(id=>{
    if (id===peer.id || outCalls[id]) return;
    try{ const c=peer.call(id,myStream); if(c){ outCalls[id]=c; wire(c,id); } }catch(e){}
  });
}
function pruneVoice(){
  const alive=new Set((view&&view.peers)||[]);
  Object.keys(audios).forEach(id=>{ if(!alive.has(id)){ try{ audios[id].srcObject=null; audios[id].remove(); }catch(e){} delete audios[id]; meterDrop(id); } });
  [outCalls,inCalls].forEach(m=>Object.keys(m).forEach(id=>{ if(!alive.has(id)){ try{ m[id].close(); }catch(e){} delete m[id]; } }));
}
function stopVoice(){
  try{ myStream && myStream.getTracks().forEach(t=>t.stop()); }catch(e){}
  myStream=null; micOn=false; autoMic=false;
  Object.keys(meters).forEach(meterDrop);
  Object.keys(audios).forEach(id=>{ try{ audios[id].srcObject=null; audios[id].remove(); }catch(e){} });
  audios={}; outCalls={}; inCalls={};
}
async function toggleMic(){
  if (!view || !view.code) return;
  if (!myStream){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Este navegador não deixa usar o microfone aqui.'); return; }
    try{ myStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); micOn=true; if (peer&&peer.id) meterAdd(peer.id,myStream); }
    catch(e){ toast('Não consegui acessar o microfone. Libere a permissão no navegador.'); return; }
    callAll();
  } else {
    micOn=!micOn; myStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  }
  render();
}
function micHTML(cls){
  if (!view || !view.code) return '';
  const st=!myStream?'':(micOn?' on':' mute');
  const lb=!myStream?'Ligar microfone':(micOn?'Mutar':'Falar');
  return '<button class="'+(cls||'micbtn')+st+'" data-act="mic" aria-pressed="'+(myStream&&micOn?'true':'false')+'">'+lb+'</button>';
}

/* ================= Minha voz (gravar os gritos) ================= */
const SLOTS=[['truco','Truco'],['seis','Seis'],['nove','Nove'],['doze','Doze ou queda']];
const CLIP_KEY={4:'truco',8:'seis',9:'nove',12:'doze'};
const ckey=k=>'trucomg-voz-'+k;
function getClip(k){ try{ return localStorage.getItem(ckey(k)); }catch(e){ return null; } }
function setClip(k,v){ try{ if(v) localStorage.setItem(ckey(k),v); else localStorage.removeItem(ckey(k)); return true; }catch(e){ toast('Não deu para guardar a gravação neste navegador.'); return false; } }
function clipFor(value){ const k=CLIP_KEY[value]; return k ? getClip(k) : null; }
function playClip(c){ try{ const au=new Audio(c); const pr=au.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} }
const toDataURL=blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
let rec=null;
async function toggleRecord(k){
  if (rec){ rec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){ toast('Este navegador não grava áudio.'); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ toast('Não consegui acessar o microfone. Libere a permissão no navegador.'); return; }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  let mr;
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000}); }
  catch(e){ stream.getTracks().forEach(t=>t.stop()); toast('Este navegador não grava áudio.'); return; }
  const chunks=[]; let timer;
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{
    clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); rec=null;
    try{
      if (chunks.length){
        const url=await toDataURL(new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'}));
        if (url.length>110000) toast('Gravação muito longa. Tente algo mais curto.'); else setClip(k,url);
      }
    }catch(e){ toast('A gravação falhou.'); }
    drawVoiceBox();
  };
  rec={k,stop:()=>{ try{ if(mr.state!=='inactive') mr.stop(); }catch(e){} }};
  mr.start(); timer=setTimeout(()=>rec&&rec.stop(),3000); drawVoiceBox();
}
function drawVoiceBox(){
  const box=document.getElementById('voz-ov'); if(!box) return;
  const rows=SLOTS.map(s=>{
    const k=s[0], has=!!getClip(k), on=rec&&rec.k===k;
    return '<div class="vrow"><strong>'+s[1]+'</strong><div class="vbtns">'
      +'<button class="btn'+(on?' no':' sec')+'" data-v="rec" data-k="'+k+'">'+(on?'Parar':(has?'Regravar':'Gravar'))+'</button>'
      +(has?'<button class="btn sec" data-v="play" data-k="'+k+'">Ouvir</button><button class="btn sec" data-v="del" data-k="'+k+'">Apagar</button>':'')
      +'</div></div>';
  }).join('');
  box.innerHTML='<div class="box" role="dialog" aria-label="Minha voz"><h2>Minha voz</h2>'
    +'<p>Grave cada grito, com até 3 segundos. Por padrão, o jogo fala o grito. Quando você gravar um áudio personalizado, ele substitui o som padrão correspondente. A gravação fica neste aparelho.</p>'
    +rows+'<button class="btn" data-v="close">Pronto</button></div>';
}
function openVoiceBox(){
  if (document.getElementById('voz-ov')) return;
  const d=document.createElement('div'); d.id='voz-ov'; d.className='overlay'; d.style.zIndex=45; d.style.overflowY='auto'; d.style.placeItems='start center';
  d.addEventListener('click',e=>{
    const b=e.target.closest('[data-v]'); if(!b) return;
    const k=b.dataset.k, a=b.dataset.v;
    if (a==='rec') toggleRecord(k);
    else if (a==='play'){ const c=getClip(k); if(c) playClip(c); }
    else if (a==='del'){ setClip(k,null); drawVoiceBox(); }
    else if (a==='close'){ if(rec) rec.stop(); d.remove(); }
  });
  document.body.appendChild(d); drawVoiceBox();
}

let chatLog=[], chatUnread=0, chatScope=null, chatN=0, chatLast={};
const myCid=()=>role==='host'?'host':(peer&&peer.id);
function chatReset(){ chatLog=[]; chatUnread=0; chatScope=null; chatLast={}; closeChat(); }
function chatIn(cid,text){                          // anfitrião: valida e distribui
  if (!S) return;
  const i=S.seats.findIndex(s=>s.cid===cid); if (i<0) return;
  text=String(text||'').replace(/\s+/g,' ').trim().slice(0,200); if (!text) return;
  const now=Date.now(); if (now-(chatLast[cid]||0)<500) return; chatLast[cid]=now;
  const plan=S.phase==='plan';                      // no planejamento, só o time conversa
  const m={t:'chat',id:++chatN,cid,name:S.seats[i].name,text};
  S.seats.forEach((s,j)=>{
    if (s.kind!=='human' || (plan && j%2!==i%2)) return;
    if (s.cid==='host') chatShow(m);
    else { const c=conns[s.cid]; if (c && c.open) c.send(m); }
  });
}
function sendChat(text){
  if (role==='host') chatIn('host',text);
  else if (hostConn && hostConn.open) hostConn.send({t:'chat',text});
  else toast('Sem conexão com a sala.');
}
function chatLine(m){
  const el=document.createElement('div');
  if (m.sys){ el.className='cm sys'; el.textContent=m.text; return el; }
  const mine=m.cid===myCid();
  el.className='cm'+(mine?' mine':'');
  const b=document.createElement('b'); b.textContent=mine?'Você':m.name;
  el.appendChild(b); el.appendChild(document.createTextNode(m.text));
  return el;
}
function chatPush(m){
  chatLog.push(m); if (chatLog.length>100) chatLog.shift();
  const log=document.getElementById('chat-log');
  if (log){ log.appendChild(chatLine(m)); log.scrollTop=log.scrollHeight; return true; }
  return false;
}
function chatBadge(){ document.querySelectorAll('.cbadge').forEach(b=>b.textContent=chatUnread||''); }
function chatShow(m){
  const open=chatPush(m);
  if (open || m.cid===myCid()) return;
  chatUnread++; chatBadge(); toast(m.name+': '+m.text);
}
function chatSys(text){ chatPush({sys:true,text}); }
function chatSync(){                                // chamado a cada render
  if (!view || !view.code) return;
  const sc=view.phase==='plan'?'team':'all';
  if (sc!==chatScope){
    if (chatScope!==null) chatSys(sc==='team'?'Agora o chat é só do seu time.':'A mesa abriu: o chat agora é de todos.');
    chatScope=sc;
  }
  const t=document.getElementById('chat-title');
  if (t) t.textContent=sc==='team'?'Conversa do seu time':'Conversa da mesa';
}
function chatBtnHTML(cls){
  if (!view || !view.code) return '';
  return '<button class="'+(cls||'chatbtn')+'" data-act="chat">Chat<span class="cbadge">'+(chatUnread||'')+'</span></button>';
}
function fitChat(){
  const ov=document.getElementById('chat-ov'), sh=document.getElementById('chat-sheet'), vv=window.visualViewport;
  if (!ov || !vv) return;
  ov.style.bottom=Math.max(0,window.innerHeight-vv.height-vv.offsetTop)+'px';
  sh.style.maxHeight=Math.floor(vv.height*.8)+'px';
}
function closeChat(){
  const d=document.getElementById('chat-ov'); if (d) d.remove();
  if (window.visualViewport){ visualViewport.removeEventListener('resize',fitChat); visualViewport.removeEventListener('scroll',fitChat); }
}
function openChat(){
  if (document.getElementById('chat-ov')) return;
  const d=document.createElement('div'); d.id='chat-ov'; d.className='chat-ov';
  d.innerHTML='<div class="chat-sheet" id="chat-sheet" role="dialog" aria-label="Conversa da mesa">'
    +'<div class="chat-head"><strong id="chat-title"></strong><button class="exit" data-c="close">Fechar</button></div>'
    +'<div class="chat-log" id="chat-log" aria-live="polite"></div>'
    +'<div class="chat-quick">'+QUICK.map(q=>'<button data-c="q" data-t="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>'
    +'<div class="chat-form"><input id="chat-in" maxlength="200" autocomplete="off" enterkeyhint="send" placeholder="Escreva para a mesa"><button class="btn" data-c="send">Enviar</button></div></div>';
  const inp=d.querySelector('#chat-in');
  const submit=()=>{ const t=inp.value.trim(); if (t){ sendChat(t); inp.value=''; } };
  d.addEventListener('click',e=>{
    if (e.target===d){ closeChat(); return; }
    const b=e.target.closest('[data-c]'); if (!b) return;
    if (b.dataset.c==='close') closeChat();
    else if (b.dataset.c==='q') sendChat(b.dataset.t);
    else if (b.dataset.c==='send') submit();
  });
  inp.addEventListener('keydown',e=>{ if (e.key==='Enter'){ e.preventDefault(); submit(); } else if (e.key==='Escape') closeChat(); });
  document.body.appendChild(d);
  const log=d.querySelector('#chat-log'); chatLog.forEach(m=>log.appendChild(chatLine(m))); log.scrollTop=log.scrollHeight;
  chatUnread=0; chatBadge(); chatSync();
  if (window.visualViewport){ visualViewport.addEventListener('resize',fitChat); visualViewport.addEventListener('scroll',fitChat); fitChat(); }
}

let planEndLocal=0;
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function setView(v){ view=v; if (v.plan) planEndLocal=Date.now()+v.plan.left; }
setInterval(()=>{
  if (!view || view.phase!=='plan') return;
  const el=document.getElementById('plan-time');
  if (el) el.textContent=fmt(Math.max(0,Math.ceil((planEndLocal-Date.now())/1000)));
},500);
const app=document.getElementById('app');
function toast(t){
  const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
function playDefaultShout(text){
  // Som padrão enquanto ninguém gravou um grito personalizado.
  // Ao existir gravação, showShout usa o áudio gravado no lugar deste padrão.
  try {
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
    const phrase=String(text||'').replace(/[!！]/g,'').trim();
    if (!['Truco','Seis','Nove','Doze','Doze ou queda'].includes(phrase)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(phrase==='Doze ou queda'?'Doze':phrase);
    u.lang='pt-BR'; u.rate=1.08; u.pitch=1.12; u.volume=1;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
function showShout(sh){
  if (sh.clip) playClip(sh.clip);
  else playDefaultShout(sh.text);
  const d=document.createElement('div'); d.className='shout'; d.innerHTML=esc(sh.text)+'<small>'+esc(sh.name)+'</small>';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1700);
}

function renderGame(v){
  const n=v.mode, me=v.mySeat, mt=v.myTeam;
  const rel=s=>(s-me+n)%n;
  const at=(r,rx,ry)=>{ const f=(90-r*360/n)*Math.PI/180; return 'left:'+(50+rx*Math.cos(f)).toFixed(1)+'%;top:'+(50+ry*Math.sin(f)).toFixed(1)+'%'; };
  const us=v.scores[mt], them=v.scores[1-mt];
  if (!v.myTurn) selected=-1;

  const seatsHTML=v.seats.map((s,i)=>{
    if (i===me) return '';
    const backs=Array.from({length:v.counts[i]},()=>'<span class="card back'+(i%2!==v.mySeat%2?' opp':'')+'"></span>').join('');
    const partner=n>2 && i%2===me%2;
    const face='<span class="face'+(emoNow[i]?' on':'')+'" data-face="'+i+'" aria-label="Carinha de '+esc(s.name)+'">'+(emoNow[i]||'😐')+'</span>';
    return '<div class="seat'+(v.turn===i?' turn':'')+'" data-pid="'+(s.pid||'')+'" style="'+at(rel(i),38,36)+'"><div class="who">'+esc(s.name)+(partner?'<small>parceiro</small>':'')+'</div><div class="seatrow"><div class="backs">'+backs+'</div>'+face+'</div></div>';
  }).join('');

  const cur=v.table.map(p=>p.seat+(p.card||'x'));
  let topSeat=-1, topW=-2; v.table.forEach(p=>{ const w=p.hidden?-1:pw(p.card); if (w>=topW){ topW=w; topSeat=p.seat; } });
  const playsHTML=v.table.map(p=>{
    const gl=p.seat%2===v.mySeat%2?' glow-a':(p.seat===topSeat?' glow-r':'');
    const isNew=!prevTable.includes(p.seat+(p.card||'x'));
    return '<div class="play" style="'+at(rel(p.seat),n>4?24:18,n>4?21:18)+'">'+(p.hidden?'<span class="card back'+(p.seat%2!==v.mySeat%2?' opp':'')+gl+(isNew?' new':'')+'" role="img" aria-label="Carta escondida"></span>':cardHTML(p.card,(isNew?'new':'')+gl))+'</div>';
  }).join('');
  prevTable=cur;

  const pips=Array.from({length:3},(_,i)=>{
    const r=v.results[i]; const c = r===undefined ? '' : r===-1 ? 't' : r===mt ? 'w' : 'l';
    return '<span class="pip '+c+'"></span>';
  }).join('');

  const handHTML=v.hand.map((c,i)=>'<button class="cardbtn'+(selected===i?' sel':'')+'" data-act="play" data-i="'+i+'" aria-label="Jogar carta">'+cardHTML(c)+'</button>').join('');

  let act='';
  if (v.tenChoice){
    act = v.tenChoice.canDecide
      ? '<div class="ask"><strong>Mão de 10!</strong> Jogar vale 4 (se perderem, o outro time leva 4). Não jogar dá 2 pontos ao outro time.</div><div class="actions"><button class="btn ok" data-act="tenplay">Jogar</button><button class="btn no" data-act="tenrun">Não jogar</button></div>'
      : '<div class="ask">O outro time está decidindo a mão de 10…</div>';
  } else if (v.pending){
    const p=v.pending;
    if (p.canRespond){
      act='<div class="ask"><strong>'+esc(v.seats[p.from].name)+' pediu '+CALL[p.toValue]+'!</strong> A mão passa a valer '+p.toValue+'.</div>'
        +'<div class="actions"><button class="btn ok" data-act="accept">Aceitar</button><button class="btn no" data-act="run">Correr</button>'
        +(p.raiseTo?'<button class="btn" data-act="raise">'+CALL[p.raiseTo]+'!</button>':'')+'</div>';
    } else act='<div class="ask">Esperando resposta ao '+CALL[p.toValue]+'…</div>';
  } else if (v.phase==='play'){
    act='<div class="actions">'+(v.nextValue?'<button class="btn" data-act="truco"'+(v.canTruco?'':' disabled')+'>'+CALL[v.nextValue]+'!</button>':'')
      +'<button class="btn sec" data-act="hide">Esconder</button></div>';
  }

  let over='';
  if (v.phase==='over'){
    const won=v.winnerTeam===mt;
    const sw=v.seriesWins||[0,0], target=v.seriesTarget||1, no=v.matchNo||1, seriesDone=sw.some(w=>w>=target); const seriesWon=sw[mt]>=target;
    over='<div class="overlay"><div class="box"><h2>'+(won?'Vitória na partida!':'Partida perdida')+'</h2><p>'+(won?'A mesa é nossa nesta partida.':'O outro time venceu esta partida.')+' Placar: '+us+' a '+them+'.</p><p>Quedas: partida '+no+' de '+target+'<br>Vitórias na sequência: Nós '+sw[mt]+' x '+sw[1-mt]+' Eles.</p>'+(seriesDone?'<h3>'+(seriesWon?'Vitória na sequência!':sw[mt]===sw[1-mt]?'Sequência empatada!':'Sequência perdida!')+'</h3>':'<p>Próxima partida da sequência disponível.</p>')
      +(v.isHost?'<button class="btn" data-act="rematch">'+(seriesDone?'Nova sequência':'Próxima queda')+'</button>':'<p>Aguardando o anfitrião.</p>')
      +'<button class="btn sec" data-act="leave">Sair</button></div></div>';
  }

  app.innerHTML=
  '<div class="game">'
  +'<div class="top"><div class="score"><span>Nós</span><b class="us">'+us+'</b><span>x</span><b class="them">'+them+'</b><span>Eles</span></div>'
  +'<div class="pips" aria-label="Rodadas">'+pips+'</div><div class="val">Vale '+v.value+(v.ten?' · 10 pts: truco dá 4 ao rival':'')+'</div><button class="exit" data-act="leave">Sair</button></div>'
  +'<div class="table n'+n+'">'+seatsHTML+playsHTML+sigPopHTML(v)+'</div>'
  +'<div class="msg" aria-live="polite">'+esc(v.msg)+'</div>'
  +'<div class="me'+(v.turn===me?' turn':'')+'" data-pid="'+(v.seats[me].pid||'')+'"><div class="whorow"><div class="who">'+esc(v.seats[me].name)+(v.myTurn?', sua vez':'')+'</div>'+micHTML()+chatBtnHTML()+'</div><div class="handrow"><div class="hand">'+handHTML+'</div><span class="face'+(emoNow[me]?' on':'')+'" data-face="'+me+'" aria-label="Sua carinha">'+(emoNow[me]||'😐')+'</span></div></div>'
  +act+over+'</div>';

  if (v.myTurn && !prevMine){ try{ navigator.vibrate && navigator.vibrate(60); }catch(e){} }
  prevMine=v.myTurn;
}

function render(){
  if (!view){ renderHome(); return; }
  setVar(view.variant,view.custom);
  pruneVoice(); if (myStream) callAll();
  if (view.shout && view.shout.id!==lastShout){ if(!firstView) showShout(view.shout); lastShout=view.shout.id; }
  firstView=false; chatSync();
  if (view.code || role==='host'){ const k=(view.phase==='lobby'?'l':'g')+'|'+view.mySeat; if (k!==sigSentKey){ sigSentKey=k; if (sigShare()) setTimeout(sendSinais,0); } }
  if (view.code && !autoMic){ autoMic=true; toggleMic(); }
  if (view.phase==='lobby') renderLobby(view); else if (view.phase==='plan') renderPlan(view); else renderGame(view);
}

function confirmLeave(){
  if (document.getElementById('leave-ov')) return;
  const d=document.createElement('div'); d.id='leave-ov'; d.className='overlay'; d.style.zIndex=50;
  d.innerHTML='<div class="box" role="dialog" aria-label="Sair da mesa"><h2>Sair da mesa?</h2><p>A partida em andamento será encerrada para você.</p>'
    +'<button class="btn no" data-x="sim">Sair</button><button class="btn sec" data-x="nao">Ficar</button></div>';
  d.addEventListener('click',e=>{
    const b=e.target.closest('[data-x]');
    if (!b){ if (e.target===d) d.remove(); return; }
    d.remove(); if (b.dataset.x==='sim') goHome();
  });
  document.body.appendChild(d);
}

app.addEventListener('click',e=>{
  unlockAudio();
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if (a==='create') createRoom(true);
  else if (a==='createpriv') createRoom(false);
  else if (a==='rooms') openRooms();
  else if (a==='roomsback'){ roomsStop(); renderHome(); }
  else if (a==='chair'){ const i=+b.dataset.i, code=b.dataset.code; roomsStop(); if (code) joinRoom(code, i>=0?i:undefined); else createRoom(true, i>=0?i:0); }
  else if (a==='sit') send({k:'sit',i:+b.dataset.i});
  else if (a==='pick') send({k:'pick',c:b.dataset.c});
  else if (a==='cpreset') send({k:'cpreset'});
  else if (a==='cclear') send({k:'cclear'});
  else if (a==='enter'){ const c=b.dataset.code; roomsStop(); joinRoom(c); }
  else if (a==='join') joinRoom();
  else if (a==='solo') playSolo();
  else if (a==='mic') toggleMic();
  else if (a==='chat') openChat();
  else if (a==='voz') openVoiceBox();
  else if (a==='sinais') openSigBox();
  else if (a==='sigtoggle'){ sigOpen=!sigOpen; renderGame(view); }
  else if (a==='sigcfg'){ sigOpen=false; renderGame(view); openSigBox(); }
  else if (a==='sigcol'){ sigOpen=false; renderGame(view); openColinha(); }
  else if (a==='emote'){ sigOpen=false; renderGame(view); sendEmote(b.dataset.e); }
  else if (a==='go') send({k:'go'});
  else if (a==='copy'){
    const t=b.dataset.t;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Copiado!'),()=>toast(t));
    else toast(t);
  }
  else if (a==='mode') send({k:'mode',m:+b.dataset.m});
  else if (a==='variant') send({k:'variant',v:b.dataset.v});
  else if (a==='shuffle') send({k:'shuffle'});
  else if (a==='start') send({k:'start'});
  else if (a==='series') send({k:'series',n:+b.dataset.n});
  else if (a==='seriescustom') { const inp=document.getElementById('series-custom'); send({k:'series',n:inp?+inp.value:1}); }
  else if (a==='hide'){
    if (!view || !view.myTurn){ toast('Ainda não é a sua vez.'); return; }
    if (!view.canHide){ toast('Só dá para esconder a partir da 2ª rodada.'); return; }
    if (selected<0){ toast('Toque numa carta e depois em Esconder.'); return; }
    const i=selected; selected=-1; send({k:'play',i,hide:true});
  }
  else if (a==='play'){
    const i=+b.dataset.i;
    if (!view || !view.myTurn) { toast(view && view.pending ? 'Responda ao pedido primeiro.' : 'Ainda não é a sua vez.'); return; }
    if (selected===i){ selected=-1; send({k:'play',i}); } else { selected=i; renderGame(view); }
  }
  else if (a==='truco') send({k:'truco',clip:clipFor(view&&view.nextValue)});
  else if (a==='raise') send({k:'raise',clip:clipFor(view&&view.pending&&view.pending.raiseTo)});
  else if (a==='accept'||a==='run'||a==='rematch'||a==='tenplay'||a==='tenrun') send({k:a});
  else if (a==='leave') confirmLeave();
});

if (typeof window!=='undefined' && window.__TRUCO_TEST) window.__TRUCO_TEST.api={ playSolo, setVariant:v=>{RATO=v==='rato';TRUCAO=v==='trucao'}, makeDeck, newMatch, resetSeats, startMatch, handleAction, handWinner, pw, getS:()=>S, emoteIn, sinaisIn, makeView, tenRule, botsSignalAll, partnerPower };

renderHome();
})();
</script>
